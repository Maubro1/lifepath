name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Assert Xcode version
        run: |
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 26" || { echo "::error::Runner lacks Xcode 26"; exit 1; }
      - name: Core tests
        # Failures become annotations, readable via the public API without a login.
        run: |
          swift test --package-path Core 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          grep -E "error:|failed" test.log | head -10 | while read -r line; do echo "::error::$line"; done
          exit $status
      - name: Diary tests
        run: |
          swift test --package-path Diary 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          grep -E "error:|failed" test.log | head -10 | while read -r line; do echo "::error::$line"; done
          exit $status

  build:
    needs: test
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Archive (unsigned)
        run: |
          xcodebuild archive -project LifePath.xcodeproj -scheme LifePath \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/LifePath.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # Compile errors become annotations, readable via the public API without a login.
          grep -E "error:" build.log | sort -u | head -10 | while read -r line; do echo "::error::$line"; done
          exit $status
      - name: Package IPA
        run: bash scripts/package-ipa.sh build/LifePath.xcarchive build/LifePath.ipa
      - name: Verify IPA layout
        run: unzip -l build/LifePath.ipa | grep -q "Payload/LifePath.app/LifePath$" || { echo "::error::Bad IPA layout"; exit 1; }
      - name: Verify Info.plist keys
        run: |
          plist=build/LifePath.xcarchive/Products/Applications/LifePath.app/Info.plist
          for k in UIBackgroundModes NSLocationWhenInUseUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription NSMotionUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$k" "$plist" >/dev/null || { echo "::error::Missing $k"; exit 1; }
          done
          # Background recording silently stops if `location` disappears from this array.
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$plist" | grep -qx "[[:space:]]*location" || { echo "::error::UIBackgroundModes lacks location"; exit 1; }
          id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist")
          [ "$id" = "app.lifepath.LifePath" ] || { echo "::error::Bundle ID is $id"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: LifePath-ipa
          path: build/LifePath.ipa
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/LifePath.ipa
          # Tags with a suffix (v0.1.1-preview.2) are marked as pre-releases: installable, not yet tested on the phone.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Screenshots for visual checks: only when the commit message asks with [screens]. Pushed to the `screens` branch.
  screens:
    needs: test
    if: contains(github.event.head_commit.message, '[screens]')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Screenshots
        run: bash scripts/screens.sh
      - name: Publish to the screens branch
        run: |
          cd screens
          git init -q
          git checkout -q -b screens
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screens for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screens
